[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safemigrate"
version = "0.1.0"
description = "Pure-static PostgreSQL schema migration risk analyzer using SQLGlot AST parsing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "pr6thv3" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "sqlglot>=25.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
safemigrate = "safemigrate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/safemigrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
